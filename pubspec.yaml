name: math_med
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IBM Plex Sans Thai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
